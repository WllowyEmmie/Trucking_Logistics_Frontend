<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="dispatch-tokens.css">
</helmet>
<span style="display:inline-flex;align-items:center;gap:{{gap}};height:{{h}};padding-inline:{{px}};border-radius:999px;border:1px solid {{fg}};background:{{bg}};color:{{fg}};font-family:var(--font-sans);font-size:{{fs}};font-weight:600;line-height:1;white-space:nowrap;box-sizing:border-box;flex:none"><span style="width:{{dot}};height:{{dot}};border-radius:999px;background:{{dotBg}};border:2px solid {{fg}};box-sizing:border-box;flex:none"></span>{{label}}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:48},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pending&quot;,&quot;assigned&quot;,&quot;in_transit&quot;,&quot;completed&quot;,&quot;cancelled&quot;,&quot;failed&quot;,&quot;available&quot;,&quot;on_delivery&quot;,&quot;maintenance&quot;,&quot;offline&quot;],&quot;default&quot;:&quot;in_transit&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;,&quot;lg&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'sm'|'md'|'lg'&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string | undefined&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const M = {
      pending: ['Pending', '--status-pending', 0], assigned: ['Assigned', '--status-assigned', 1], in_transit: ['In transit', '--status-transit', 1],
      completed: ['Completed', '--status-completed', 1], cancelled: ['Cancelled', '--status-cancelled', 0], failed: ['Failed', '--status-failed', 1],
      available: ['Available', '--truck-available', 1], on_delivery: ['On delivery', '--truck-busy', 1], maintenance: ['Maintenance', '--truck-maintenance', 0], offline: ['Offline', '--truck-offline', 0]
    };
    const s = this.props.status ?? 'in_transit';
    const [label, v, filled] = M[s] || [s, '--status-pending', 0];
    const Z = { sm: [22, 12, 8, 8, 5], md: [26, 13, 10, 9, 6], lg: [34, 16, 14, 11, 8] }[this.props.size ?? 'md'] || [26, 13, 10, 9, 6];
    return { label: this.props.label ?? label, fg: `var(${v})`, bg: `var(${v}-bg)`, dotBg: filled ? `var(${v})` : 'transparent', h: Z[0] + 'px', fs: Z[1] + 'px', px: Z[2] + 'px', dot: Z[3] + 'px', gap: Z[4] + 'px' };
  }
}
</script>
</body>
</html>
